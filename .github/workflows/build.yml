name: Build .NET riscv64 nupkgs

run-name: "Build .NET riscv64 nupkgs : ${{ inputs.branch }}"

on:
  workflow_dispatch:
    inputs:
      fork:
        description: 'dotnet VMR fork name'
        required: true
        type: string
        default: dotnet
      branch:
        description: 'dotnet VMR branch name'
        required: true
        type: string
        default: main
      branding:
        description: 'SDK branding'
        required: true
        type: choice
        options:
          - unstable
          - preview
          - release
        default: preview
      release:
        description: 'publish release'
        type: boolean

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: linux
            libc: glibc
            docker_tag: azurelinux-3.0-net10.0-cross-riscv64
          - name: linux-musl
            libc: musl
            docker_tag: azurelinux-3.0-net10.0-cross-riscv64-musl

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Maximize build space
      uses: AdityaGarg8/remove-unwanted-software@v4.1
      with:
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-cached-tools: 'true'
        remove-docker-images: 'true'

    - name: Clone repository
      run: |
        git clone --single-branch --depth 1 -b ${{ inputs.branch }} https://github.com/${{ inputs.fork }}/dotnet

    - name: Build
      run: |
        major_version=$(echo "${{ inputs.branch }}" | sed -E 's/^v?([0-9]+)\..*/\1/')

        branding_arg=""
        if [[ "$major_version" =~ ^[0-9]+$ ]] && [ "$major_version" -ge 11 ]; then
          branding_arg="--branding ${{ inputs.branding }}"
        fi

        echo "Major version: $major_version"
        echo "Branding argument: $branding_arg"

        # 去掉了 --clean-while-building，让中间产物(含 Shipping 目录下的 nupkg)保留到构建结束
        docker run --platform linux/amd64 --rm -v${{ github.workspace }}/dotnet:/dotnet -w /dotnet -e ROOTFS_DIR=/crossrootfs/riscv64 \
          mcr.microsoft.com/dotnet-buildtools/prereqs:${{ matrix.docker_tag }} \
            ./build.sh --prep -sb --os ${{ matrix.name }} --rid ${{ matrix.name }}-riscv64 --arch riscv64 \
              $branding_arg -p:OfficialBuildId=$(date +%Y%m%d).99

    - name: Check disk space after build
      if: always()
      run: df -h

    # 先列出所有产出的 riscv64 nupkg，确认实际路径长什么样，
    # 第一次跑完之后可以照日志把下面 Collect 步骤里的 find 表达式改精确
    - name: List riscv64 nupkg artifacts
      run: |
        find "${{ github.workspace }}/dotnet/artifacts" -iname '*riscv64*.nupkg' -print

    - name: Collect target nupkgs into a flat dir
      run: |
        set -ex
        mkdir -p release-assets
        find "${{ github.workspace }}/dotnet/artifacts" \
          \( -iname 'Microsoft.NETCore.App.Runtime.*riscv64*.nupkg' \
          -o -iname 'Microsoft.NETCore.App.Host.*riscv64*.nupkg' \
          -o -iname 'Microsoft.AspNetCore.App.Runtime.*riscv64*.nupkg' \) \
          -exec cp {} release-assets/ \;
        ls -la release-assets/

    - name: Upload riscv64 nupkgs
      uses: actions/upload-artifact@v4
      with:
        name: dotnet-riscv64-nupkgs-${{ matrix.name }}
        path: release-assets/*.nupkg
        if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: always() && inputs.release

    permissions:
      contents: write

    steps:
    - name: Download artifacts
      if: needs.build.result == 'success'
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Make release (Success)
      if: needs.build.result == 'success'
      run: |
        nupkg_paths=$(find "${{ github.workspace }}/artifacts" -name '*.nupkg')

        artifacts=""
        tag_name=""

        for nupkg_path in $nupkg_paths; do
          nupkg_filename=$(basename "$nupkg_path")
          # 从任意一个包名里抓版本号，例如
          # Microsoft.NETCore.App.Runtime.linux-riscv64.10.0.11.nupkg -> 10.0.11
          pkg_version=$(echo "$nupkg_filename" | sed -E 's/^.*riscv64\.([0-9][^.]*(\.[^.]+)*)\.nupkg$/\1/')
          artifacts="$artifacts $nupkg_path"
          tag_name="riscv64-$pkg_version"
        done

        echo "tag_name: $tag_name"
        echo "artifacts: $artifacts"

        if [ "${{ inputs.branding }}" = "release" ]; then
          gh release create "$tag_name" $artifacts --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "$tag_name" --notes "$tag_name"
        else
          gh release create "$tag_name" $artifacts --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "$tag_name" --notes "$tag_name" --prerelease
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create failed tag
      if: needs.build.result == 'failure' && inputs.branch != 'main'
      run: |
        tag_name="${{ inputs.branch }}.${{ github.run_id }}.failed"
        echo "tag_name: $tag_name"

        gh api repos/${{ github.repository }}/git/refs -f ref="refs/tags/$tag_name" -f sha="${{ github.sha }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
