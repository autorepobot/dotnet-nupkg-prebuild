name: Build .NET Linux and Windows Mono nupkgs

run-name: "Build .NET nupkgs : ${{ inputs.branch }}"

on:
  workflow_dispatch:
    inputs:
      fork:
        description: 'dotnet VMR fork name'
        required: true
        type: string
        default: dotnet
      branch:
        description: 'dotnet VMR branch name'
        required: true
        type: string
        default: main
      branding:
        description: 'SDK branding'
        required: true
        type: choice
        options:
          - unstable
          - preview
          - release
        default: preview
      release:
        description: 'publish release'
        type: boolean

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: linux
            libc: glibc
            docker_tag: azurelinux-3.0-net10.0-cross-riscv64

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Maximize build space
      uses: AdityaGarg8/remove-unwanted-software@v4.1
      with:
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-cached-tools: 'true'
        remove-docker-images: 'true'

    - name: Clone repository
      run: |
        git clone --single-branch --depth 1 -b ${{ inputs.branch }} https://github.com/${{ inputs.fork }}/dotnet

    - name: Build
      run: |
        major_version=$(echo "${{ inputs.branch }}" | sed -E 's/^v?([0-9]+)\..*/\1/')

        branding_arg=""
        if [[ "$major_version" =~ ^[0-9]+$ ]] && [ "$major_version" -ge 11 ]; then
          branding_arg="--branding ${{ inputs.branding }}"
        fi

        echo "Major version: $major_version"
        echo "Branding argument: $branding_arg"

        docker run --platform linux/amd64 --rm \
          -v${{ github.workspace }}/dotnet:/dotnet \
          -w /dotnet \
          -e ROOTFS_DIR=/crossrootfs/riscv64 \
          mcr.microsoft.com/dotnet-buildtools/prereqs:${{ matrix.docker_tag }} \
            ./build.sh --prep -sb \
              --os ${{ matrix.name }} \
              --rid ${{ matrix.name }}-riscv64 \
              --arch riscv64 \
              $branding_arg \
              -p:OfficialBuildId=$(date +%Y%m%d).99

    - name: Check disk space after build
      if: always()
      run: df -h

    - name: List riscv64 nupkg artifacts
      run: |
        find "${{ github.workspace }}/dotnet/artifacts" \
          -iname '*riscv64*.nupkg' -print

    - name: Collect target nupkgs into a flat dir
      run: |
        set -ex
        mkdir -p release-assets
        find "${{ github.workspace }}/dotnet/artifacts" \
          \( -iname 'Microsoft.NETCore.App.Runtime.*riscv64*.nupkg' \
          -o -iname 'Microsoft.NETCore.App.Host.*riscv64*.nupkg' \
          -o -iname 'Microsoft.AspNetCore.App.Runtime.*riscv64*.nupkg' \) \
          -exec cp {} release-assets/ \;
        ls -la release-assets/

    - name: Upload riscv64 nupkgs
      uses: actions/upload-artifact@v4
      with:
        name: dotnet-riscv64-nupkgs-${{ matrix.name }}
        path: release-assets/*.nupkg
        if-no-files-found: error

  build-ppc64le:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Maximize build space
      uses: AdityaGarg8/remove-unwanted-software@v4.1
      with:
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-cached-tools: 'true'
        remove-docker-images: 'true'

    - name: Clone repository
      run: |
        git clone --single-branch --depth 1 -b ${{ inputs.branch }} https://github.com/${{ inputs.fork }}/dotnet

    - name: Build
      run: |
        major_version=$(echo "${{ inputs.branch }}" | sed -E 's/^v?([0-9]+)\..*/\1/')

        branding_arg=""
        if [[ "$major_version" =~ ^[0-9]+$ ]] && [ "$major_version" -ge 11 ]; then
          branding_arg="--branding ${{ inputs.branding }}"
        fi

        echo "Major version: $major_version"
        echo "Branding argument: $branding_arg"

        docker run --platform linux/amd64 --rm \
          -v${{ github.workspace }}/dotnet:/dotnet \
          -w /dotnet \
          -e ROOTFS_DIR=/crossrootfs/ppc64le \
          mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net10.0-cross-ppc64le \
            ./build.sh --prep -sb \
              --os linux \
              --rid linux-ppc64le \
              --arch ppc64le \
              --use-mono-runtime \
              $branding_arg \
              -p:OfficialBuildId=$(date +%Y%m%d).99

    - name: Check disk space after build
      if: always()
      run: df -h

    - name: List ppc64le nupkg artifacts
      run: |
        find "${{ github.workspace }}/dotnet/artifacts" \
          -iname '*ppc64le*.nupkg' -print

    - name: Collect target nupkgs into a flat dir
      run: |
        set -ex
        mkdir -p release-assets

        find "${{ github.workspace }}/dotnet/artifacts" \
          \( -iname 'Microsoft.NETCore.App.Runtime.*ppc64le*.nupkg' \
          -o -iname 'Microsoft.NETCore.App.Host.*ppc64le*.nupkg' \
          -o -iname 'Microsoft.AspNetCore.App.Runtime.*ppc64le*.nupkg' \) \
          -exec cp {} release-assets/ \;

        ls -la release-assets/

    - name: Upload ppc64le nupkgs
      uses: actions/upload-artifact@v4
      with:
        name: dotnet-ppc64le-nupkgs
        path: release-assets/*.nupkg
        if-no-files-found: error

  build-loongarch64:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Maximize build space
      uses: AdityaGarg8/remove-unwanted-software@v4.1
      with:
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-cached-tools: 'true'
        remove-docker-images: 'true'

    - name: Clone repository
      run: |
        git clone --single-branch --depth 1 -b ${{ inputs.branch }} https://github.com/${{ inputs.fork }}/dotnet

    - name: Build
      run: |
        major_version=$(echo "${{ inputs.branch }}" | sed -E 's/^v?([0-9]+)\..*/\1/')

        branding_arg=""
        if [[ "$major_version" =~ ^[0-9]+$ ]] && [ "$major_version" -ge 11 ]; then
          branding_arg="--branding ${{ inputs.branding }}"
        fi

        echo "Major version: $major_version"
        echo "Branding argument: $branding_arg"

        docker run --platform linux/amd64 --rm \
          -v${{ github.workspace }}/dotnet:/dotnet \
          -w /dotnet \
          -e ROOTFS_DIR=/crossrootfs/loongarch64 \
          mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net10.0-cross-loongarch64 \
            ./build.sh --prep -sb \
              --os linux \
              --rid linux-loongarch64 \
              --arch loongarch64 \
              $branding_arg \
              -p:OfficialBuildId=$(date +%Y%m%d).99

    - name: Check disk space after build
      if: always()
      run: df -h

    - name: List loongarch64 nupkg artifacts
      run: |
        find "${{ github.workspace }}/dotnet/artifacts" \
          -iname '*loongarch64*.nupkg' -print

    - name: Collect target nupkgs into a flat dir
      run: |
        set -ex
        mkdir -p release-assets

        find "${{ github.workspace }}/dotnet/artifacts" \
          \( -iname 'Microsoft.NETCore.App.Runtime.*loongarch64*.nupkg' \
          -o -iname 'Microsoft.NETCore.App.Host.*loongarch64*.nupkg' \
          -o -iname 'Microsoft.AspNetCore.App.Runtime.*loongarch64*.nupkg' \) \
          -exec cp {} release-assets/ \;

        ls -la release-assets/

    - name: Upload loongarch64 nupkgs
      uses: actions/upload-artifact@v4
      with:
        name: dotnet-loongarch64-nupkgs
        path: release-assets/*.nupkg
        if-no-files-found: error

  build-x86:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Maximize build space
      uses: AdityaGarg8/remove-unwanted-software@v4.1
      with:
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-cached-tools: 'true'
        remove-docker-images: 'true'

    - name: Clone repository
      run: |
        git clone --single-branch --depth 1 -b ${{ inputs.branch }} https://github.com/${{ inputs.fork }}/dotnet

    - name: Build
      run: |
        major_version=$(echo "${{ inputs.branch }}" | sed -E 's/^v?([0-9]+)\..*/\1/')

        branding_arg=""
        if [[ "$major_version" =~ ^[0-9]+$ ]] && [ "$major_version" -ge 11 ]; then
          branding_arg="--branding ${{ inputs.branding }}"
        fi

        echo "Major version: $major_version"
        echo "Branding argument: $branding_arg"

        docker run --platform linux/amd64 --rm \
          -v${{ github.workspace }}/dotnet:/dotnet \
          -w /dotnet \
          -e ROOTFS_DIR=/crossrootfs/x86 \
          mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net10.0-cross-x86 \
            ./build.sh --prep -sb \
              --os linux \
              --rid linux-x86 \
              --arch x86 \
              --use-mono-runtime \
              $branding_arg \
              -p:OfficialBuildId=$(date +%Y%m%d).99

    - name: Check disk space after build
      if: always()
      run: df -h

    - name: List x86 nupkg artifacts
      run: |
        find "${{ github.workspace }}/dotnet/artifacts" \
          -iname '*linux-x86*.nupkg' -print

    - name: Collect target nupkgs into a flat dir
      run: |
        set -ex
        mkdir -p release-assets

        find "${{ github.workspace }}/dotnet/artifacts" \
          \( -iname 'Microsoft.NETCore.App.Runtime.*linux-x86*.nupkg' \
          -o -iname 'Microsoft.NETCore.App.Host.*linux-x86*.nupkg' \
          -o -iname 'Microsoft.AspNetCore.App.Runtime.*linux-x86*.nupkg' \) \
          -exec cp {} release-assets/ \;

        ls -la release-assets/

    - name: Upload x86 nupkgs
      uses: actions/upload-artifact@v4
      with:
        name: dotnet-x86-nupkgs
        path: release-assets/*.nupkg
        if-no-files-found: error

  build-windows-mono:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]

    runs-on: windows-latest
    timeout-minutes: 360

    permissions:
      contents: read

    env:
      VMR_FORK: ${{ inputs.fork }}
      VMR_BRANCH: ${{ inputs.branch }}
      TARGET_ARCH: ${{ matrix.arch }}

    steps:
    - name: Clone VMR source
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        if ($env:VMR_FORK -notmatch '^[A-Za-z0-9_.-]+$') {
          throw 'Invalid VMR fork name.'
        }
        git config --global core.longpaths true
        git clone --single-branch --depth 1 --branch $env:VMR_BRANCH "https://github.com/$env:VMR_FORK/dotnet.git" C:\dotnet
        if ($LASTEXITCODE -ne 0) { throw 'VMR clone failed.' }

    - name: Fix Mono apphost packaging
      shell: pwsh
      run: |
        $path = 'C:\dotnet\src\runtime\src\installer\pkg\sfx\Microsoft.NETCore.App\Microsoft.NETCore.App.Host.sfxproj'
        $content = [System.IO.File]::ReadAllText($path)

        $old = '<HeatOutputFileElementToStabilize Include="native\singlefilehost.exe" ReplacementId="staticapphosttemplateapphostexe" />'
        $new = '<HeatOutputFileElementToStabilize Include="native\singlefilehost.exe" ReplacementId="staticapphosttemplateapphostexe" Condition="''$(RuntimeFlavor)'' != ''Mono'' and ''$(TargetsLinuxBionic)'' != ''true''" />'

        if (-not $content.Contains($old)) {
            throw "Expected apphost packaging configuration not found."
        }

        $content = $content.Replace($old, $new)
        [System.IO.File]::WriteAllText(
            $path,
            $content,
            [System.Text.UTF8Encoding]::new($false)
        )

    - name: Build Windows Mono runtime and packages
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $runtimeRoot = 'C:\dotnet\src\runtime'
        if (-not (Test-Path "$runtimeRoot\build.cmd")) {
          throw "Runtime build entrypoint not found: $runtimeRoot\build.cmd"
        }
        $buildId = (Get-Date -Format 'yyyyMMdd') + '.99'
        Push-Location $runtimeRoot
        try {
          & .\build.cmd `
            -subset mono+libs+host.native+packs.product `
            -configuration Release `
            -arch $env:TARGET_ARCH `
            -runtimeFlavor Mono `
            -usemonoruntime `
            '/p:RuntimeSpecificFrameworkSuffix=Mono' `
            '/p:WarningsNotAsErrors=NU1603' `
            "/p:OfficialBuildId=$buildId"
          if ($LASTEXITCODE -ne 0) { throw "Mono build failed for win-$env:TARGET_ARCH." }
        }
        finally {
          Pop-Location
        }

    - name: Collect Windows Mono runtime nupkg
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $roots = @(
          'C:\dotnet\src\runtime\artifacts\packages',
          'C:\dotnet\artifacts\packages'
        )
        $pattern = "Microsoft.NETCore.App.Runtime.Mono.win-$env:TARGET_ARCH.*.nupkg"
        $packages = @(
          foreach ($root in $roots) {
            if (Test-Path $root) {
              Get-ChildItem -LiteralPath $root -File -Recurse -Filter $pattern |
                Where-Object { $_.Name -notmatch '\.symbols\.nupkg$' }
            }
          }
        )
        if ($packages.Count -eq 0) {
          throw "The Mono runtime pack $pattern was not produced in Shipping or NonShipping."
        }
        Add-Type -AssemblyName System.IO.Compression
        New-Item -ItemType Directory -Path release-assets -Force | Out-Null
        foreach ($package in $packages) {
          $archive = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            $entries = @($archive.Entries)
            $enginePath = "runtimes/win-$env:TARGET_ARCH/native/coreclr.dll"
            $engine = @($entries | Where-Object {
              $_.FullName -ieq $enginePath -and $_.Length -gt 0
            })
            $corelib = @($entries | Where-Object {
              $_.FullName -match '(^|/)System\.Private\.CoreLib\.dll$' -and $_.Length -gt 0
            })
            if ($engine.Count -ne 1 -or $corelib.Count -ne 1) {
              $entries |
                Where-Object { $_.FullName -match '(?i)(mono|coreclr|corelib)' } |
                ForEach-Object { Write-Host "Package entry: $($_.FullName) ($($_.Length) bytes)" }
              throw "Invalid Mono runtime pack: $($package.FullName) (engine=$($engine.Count), corelib=$($corelib.Count))"
            }
            Write-Host "Verified Mono runtime pack: $($package.Name)"
          }
          finally {
            $archive.Dispose()
          }
          Copy-Item -LiteralPath $package.FullName -Destination release-assets -ErrorAction Stop
          Write-Host "Collected $($package.Name)"
        }
        Get-ChildItem release-assets

    - name: Upload Windows Mono nupkg
      uses: actions/upload-artifact@v4
      with:
        name: dotnet-windows-mono-${{ matrix.arch }}-nupkgs
        path: release-assets/*.nupkg
        if-no-files-found: error

  release:
    needs:
      - build
      - build-ppc64le
      - build-loongarch64
      - build-x86
      - build-windows-mono
    runs-on: ubuntu-latest
    if: always() && inputs.release

    permissions:
      contents: write

    steps:
    - name: Download artifacts
      if: |
        needs.build.result == 'success' &&
        needs.build-ppc64le.result == 'success' &&
        needs.build-loongarch64.result == 'success' &&
        needs.build-x86.result == 'success' &&
        needs.build-windows-mono.result == 'success'
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Make release (Success)
      if: |
        needs.build.result == 'success' &&
        needs.build-ppc64le.result == 'success' &&
        needs.build-loongarch64.result == 'success' &&
        needs.build-x86.result == 'success' &&
        needs.build-windows-mono.result == 'success'
      run: |
        mapfile -t nupkg_paths < <(find "${{ github.workspace }}/artifacts" -name '*.nupkg' -print)

        artifacts=""
        tag_name=""

        for nupkg_path in "${nupkg_paths[@]}"; do
          nupkg_filename=$(basename "$nupkg_path")

          if [[ "$nupkg_filename" =~ ^Microsoft\.NETCore\.App\.Runtime\.Mono\.win-(x64|x86)\.(.+)\.nupkg$ ]]; then
            pkg_version="${BASH_REMATCH[2]}"
          elif [[ "$nupkg_filename" =~ ^.+\.linux-(x86|riscv64|ppc64le|loongarch64)\.(.+)\.nupkg$ ]]; then
            pkg_version="${BASH_REMATCH[2]}"
          else
            echo "Unexpected package name: $nupkg_filename" >&2
            exit 1
          fi

          if [[ -n "$tag_name" && "$pkg_version" != "$tag_name" ]]; then
            echo "Mismatched package versions: $tag_name vs $pkg_version" >&2
            exit 1
          fi

          artifacts="$artifacts \"$nupkg_path\""
          tag_name="$pkg_version"
        done

        echo "tag_name: $tag_name"
        echo "artifacts: $artifacts"

        if [ "${{ inputs.branding }}" = "release" ]; then
          gh release create "$tag_name" \
            "${nupkg_paths[@]}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$tag_name" \
            --notes "$tag_name"
        else
          gh release create "$tag_name" \
            "${nupkg_paths[@]}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$tag_name" \
            --notes "$tag_name" \
            --prerelease
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create failed tag
      if: |
        (needs.build.result == 'failure' ||
         needs.build-ppc64le.result == 'failure' ||
         needs.build-loongarch64.result == 'failure' ||
         needs.build-x86.result == 'failure' ||
         needs.build-windows-mono.result == 'failure')
        && inputs.branch != 'main'
      run: |
        tag_name="${{ inputs.branch }}.${{ github.run_id }}.failed"
        echo "tag_name: $tag_name"

        gh api repos/${{ github.repository }}/git/refs \
          -f ref="refs/tags/$tag_name" \
          -f sha="${{ github.sha }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
